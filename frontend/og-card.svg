<?xml version="1.0" encoding="UTF-8"?>
<!-- Source for public/og.png. Regeneration command and rationale: see the
     og:image comment in index.html. Do not add prose here: an XML comment may
     not contain a double hyphen, so CSS custom property names and docker flags
     both break the parse, and libvips reports that as "unsupported image
     format" rather than as a parse error. -->
