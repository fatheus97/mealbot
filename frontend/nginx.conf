# Access-log format that drops the QUERY STRING.
#
# nginx's stock `main` format logs "$request", which is the full request line —
# method, URI *and* query string. That is a credential leak here, because every
# emailed secret this app issues travels as a query param and is then redirected
# through this very server:
#
#   /app?reset_token=…   password_reset.py     (live single-use password reset)
#   /app?verify_token=…  email_verification.py (live single-use verification)
#   /app?invite=…        invite.py             (live single-use invite)
#
# and the `if ($arg_…) { return 302 /app$is_args$args; }` rules below deliberately
# catch those same params at `/`. So with the stock format, anyone who can read
# the container logs holds working auth secrets, sitting next to the client IP.
#
# `$uri` is the normalised path WITHOUT the query string, so the log keeps its
# operational value (status, path, bytes, timing) and loses the secrets. Applied
# server-wide so no location can opt back in by accident.
log_format mealbot_noqs '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# ─── Language negotiation for the static pages ──────────────────────────────
# A visitor arriving at /, /privacy or /terms from OUTSIDE this site, with a
# browser that prefers Czech or Slovak, gets a 302 to the Czech edition.
#
# Server-side on purpose. An HTTP redirect keeps the visitor's original Referer
# (src/utils/attribution.ts records it, and may not store it anywhere to carry
# it across a script navigation), and nothing paints in English first.
#
# $lang_prefers_cs mirrors detectLocale() in src/store/useLocaleStore.ts: the
# FIRST tag naming a language we have (en, cs, or sk, which reads Czech)
# decides, in the browser's own order; tags for other languages are skipped.
# q-values are ignored, as navigator.languages has none: browsers list best
# first. Every quantifier is possessive, so a crafted header cannot make the
# match backtrack (ReDoS). The cases live in src/test/fixtures/
# accept-language.json, which Vitest checks against detectLocale and the
# "frontend security headers" CI job checks against this map.
map $http_accept_language $lang_prefers_cs {
    default 0;
    "~*^(?:\s*+(?!(?:en|cs|sk)(?![a-z0-9]))[^,]*+,)*+\s*+(?:cs|sk)(?![a-z0-9])" 1;
}

# Never redirect a visitor who came from a page on this site: they followed one
# of our links, and on an English page that means they chose English (the
# Czech pages' "English" link, or a footer link from an English page). Without
# this, a browser that blocks storage, so cannot remember the choice, would be
# sent back to Czech on every click.
map "$host $http_referer" $lang_from_this_site {
    default 0;
    "~*^(\S+) https?://\1(?::\d+)?(?:[/?#]|$)" 1;
}

map "$lang_from_this_site$lang_prefers_cs" $lang_to_czech {
    default 0;
    01      1;
}
# A choice the visitor made (the language links, or the app's picker) is
# honoured by public/lang-redirect.js, which reads it from localStorage. This
# server sets no cookie for it: the privacy policy promises no cookies at all
# to anyone who never signs in.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative Location headers. nginx sits behind Caddy's TLS, so an absolute
    # redirect would name http:// and cost an extra hop, and the browser drops
    # the Referer on that https -> http downgrade.
    absolute_redirect off;

    access_log /var/log/nginx/access.log mealbot_noqs;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera=(self): the receipt-scan feature calls getUserMedia, which needs
    # same-origin camera permission. An empty camera=() disables the camera for
    # EVERY origin (including self), so the browser rejects getUserMedia with
    # NotAllowedError and never shows the permission prompt (mealbot-tickets#4).
    # (self) grants only this origin — no third parties, no iframes.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # style-src 'unsafe-inline' is a pragmatic concession: 290 inline style props
    # across 21 components. Removing it is a separate, large refactor.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # The SPA's own namespace (docs/landing-page-plan.md — the landing-page
    # split). Deep links (invite/reset/billing) are repointed here; served
    # from app.html, a second Vite entry (vite.config.ts), not index.html.
    # NOTE: this block declares no add_header of its own, so it inherits the
    # server-level security headers (incl. the CSP) above via nginx's normal
    # add_header inheritance — if a later edit adds an add_header HERE, that
    # inheritance breaks and every header above silently stops applying to
    # this location. Re-declare the full set if that ever happens.
    #
    # Split into an exact match + a "/app/" prefix rather than a bare
    # `location /app` — a bare prefix is a literal-STRING match in nginx, not
    # a path-segment match, so it would also swallow any future path that
    # merely starts with the four characters "app" (apple-touch-icon.png,
    # appstore-badge.svg, ...), silently serving the SPA shell instead of
    # falling through to whatever `location /` would otherwise serve.
    location = /app {
        try_files /app.html =404;
    }
    location /app/ {
        try_files $uri $uri/ /app.html;
    }

    # The static marketing landing — index.html is now hand-authored HTML/CSS,
    # not the SPA (docs/landing-page-plan.md Slice 3). Exact match only: real
    # static asset requests (favicon.svg, robots.txt, ...) and the /app
    # namespace are both handled by their own blocks above/below, so this
    # block only ever needs to serve the one page.
    #
    # No-JS server-side backup for reset_token/invite/billing links that still
    # point at the root (stale emails, or JS disabled) — belt-and-suspenders
    # alongside the same forward in src/landing/main.ts. A single `return` per
    # `if` is the well-established safe use of nginx's `if` (unlike `if` mixed
    # with `rewrite`/other directives).
    location = / {
        if ($arg_invite) { return 302 /app$is_args$args; }
        if ($arg_reset_token) { return 302 /app$is_args$args; }
        if ($arg_billing) { return 302 /app$is_args$args; }
        # After the token forwards, which must win. See $lang_to_czech above.
        if ($lang_to_czech) { return 302 /cs$is_args$args; }
        try_files /index.html =404;
    }

    # The Czech marketing landing. Vite emits it at dist/cs/index.html from the
    # `cs` entry in vite.config.ts (a nested input keeps its nested output path).
    #
    # BOTH forms are declared, and they are not interchangeable:
    #   /cs   — the canonical URL, and what hreflang/sitemap/og:url all name.
    #   /cs/  — what a browser produces when a visitor types "trymealbot.com/cs"
    #           and follows a directory-style link, and what the catch-all's
    #           `try_files $uri/` would otherwise resolve via index.html anyway.
    # Serving both from the same file rather than redirecting one to the other
    # keeps a single response for the crawler; the canonical tag inside the page
    # is what collapses them into one indexed URL.
    #
    # EXACT matches, same reasoning as `location = /app` above: a bare
    # `location /cs` is a literal-STRING prefix in nginx, so it would also
    # swallow any future path merely starting with "cs" (css/, cs-alerts.json).
    location = /cs {
        try_files /cs/index.html =404;
    }
    location = /cs/ {
        try_files /cs/index.html =404;
    }

    # Static legal page. EXACT match (`location =`), same reasoning as
    # `location = /app`: a bare prefix would also swallow `/privacy-anything`,
    # and the catch-all below already serves the SPA for genuine strays.
    # `/privacy.html` keeps working too — it is a real file, so the catch-all's
    # `try_files $uri` finds it before falling through.
    location = /privacy {
        if ($lang_to_czech) { return 302 /cs/privacy$is_args$args; }
        try_files /privacy.html =404;
    }

    location = /terms {
        if ($lang_to_czech) { return 302 /cs/terms$is_args$args; }
        try_files /terms.html =404;
    }

    # The Czech editions. Both language versions are equally authoritative
    # (terms §13), so these are not a courtesy translation sitting behind the
    # English one — they are the contract for a reader who reads Czech.
    # Exact matches, same reasoning as every block above.
    location = /cs/privacy {
        try_files /cs/privacy.html =404;
    }

    location = /cs/terms {
        try_files /cs/terms.html =404;
    }

    # Catch-all for anything not matched above. Falls through to the APP
    # (app.html), not the marketing page — an unmatched path is far more
    # likely a stray legacy SPA deep link than a marketing sub-page (the
    # landing has no sub-routes of its own). Real static files under
    # public/ (favicon.svg, robots.txt, ...) are still served directly by
    # `try_files` checking $uri first, regardless of this fallback target.
    location / {
        try_files $uri $uri/ /app.html;
    }
}
