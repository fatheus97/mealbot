services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    environment:
      # Enable the /api/demo/session endpoint locally so "Try Demo" works in dev.
      # Per-user LLM mocking (mock=current_user.is_demo) keeps demo sessions
      # from burning API credits; alpha accounts still hit the real LLM.
      - DEMO_MODE=true

  frontend:
    build:
      context: ./frontend
      target: build-stage  # Intercept the Dockerfile before it builds Nginx
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Anonymous volume to protect container dependencies
    ports:
      - "5174:5173"        # Override the 5173:80 mapping from the base compose file
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - VITE_API_BASE=http://localhost:8000/api