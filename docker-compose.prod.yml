# Production overrides — use with:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires DOMAIN env var in .env (e.g. DOMAIN=yourdomain.com)

services:
  # Disable test database
  test-db:
    profiles: ["disabled"]

  db:
    ports: !override []
    restart: unless-stopped

  backend:
    volumes: !override []
    ports: !override []
    restart: unless-stopped
    # On SIGTERM the lifespan drains the parse pool: it waits for RUNNING parses
    # (≤ PARSE_EXECUTOR_WORKERS, uninterruptible native pypdf/fastembed calls) to
    # finish before exit. Give that more room than a single parse timeout
    # (PDF_PARSE_TIMEOUT_S=20s) so a parse in flight at deploy time isn't
    # SIGKILLed mid-work — Docker's default grace is only 10s. Queued (unstarted)
    # parses are cancelled, not drained, so this bounds on worker count, not queue
    # depth.
    #
    # ─── Do not raise this to "protect long generations". It backfires. ───────
    # The tempting reasoning: plan/recipe generation is awaited INLINE in the
    # request (no background job — the user is waiting for the output), a Gemini
    # call has a 60s timeout with retries, so a generation still running when a
    # deploy lands gets SIGKILLed at 30s and the user loses it. True. But a
    # bigger grace does not fix it, because `docker compose up -d` recreates a
    # container by STOPPING THE OLD ONE FIRST: the drain window IS the downtime
    # window. uvicorn stops accepting connections on SIGTERM and exits once
    # in-flight requests finish, so the backend is unreachable for exactly as
    # long as the slowest in-flight request — bounded by this value.
    #
    # 30s is therefore not arbitrary: it MATCHES `lb_try_duration 30s` in the
    # Caddyfile, which is how long Caddy keeps re-dialing before it gives up and
    # 502s. Raise this alone and the drain outlives the retry — one user's
    # generation is saved and everyone else gets 502s for the difference. Raise
    # both and every request instead hangs for up to that long. Under real
    # concurrency it degrades further: with enough traffic something is always
    # generating, the container never drains inside the ceiling, and you pay the
    # full downtime AND still SIGKILL a generation.
    #
    # The fix at that scale is to stop trading one for the other: deploy
    # start-before-stop (a second backend replica behind Caddy, or a blue/green
    # swap) so draining costs nobody anything and a long grace becomes free —
    # or move generation to a job + polling so no request is long-lived. Both
    # are real work; neither is a knob. If you change this number, change
    # `lb_try_duration` with it and know you are picking hangs over errors.
    stop_grace_period: 30s

  frontend:
    ports: !override []
    restart: unless-stopped

  caddy:
    # Anchors do not cross compose files, so this repeats the base file's
    # x-logging block rather than referencing it. Keep the two in step.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Pinned to 2.8.4 + digest. `caddy:2-alpine` let the major tag float
    # and could roll to a new minor without a review. Digest pin makes
    # rebuilds reproducible across the Hetzner box and local/CI.
    image: caddy:2.8.4-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
