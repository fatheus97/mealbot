[mypy]
python_version = 3.14
strict = true
warn_unused_configs = true
# Migrations are write-once and never imported by app code. The migration
# failures this repo has actually had are semantic (duplicate revision ids, two
# heads) and mypy cannot see any of them, so strict here would be a permanent
# tax on every migration PR for a class of bug that has never occurred.
exclude = alembic/

# BRIDGE — temporary, delete once tests/ is fully annotated.
#
# Turns off the three flags that produce pure annotation BOOKKEEPING in the test
# tree (1324 of its 1426 strict errors) while it is being annotated in batches.
# Everything strict enables that can catch an actual contract violation stays ON
# for tests — above all check_untyped_defs, which is what makes mypy enter
# unannotated test bodies at all, and which is where every useful finding in the
# test tree came from. Also still on here: disallow_untyped_calls,
# warn_unused_ignores, warn_return_any, strict_equality, no_implicit_optional,
# no_implicit_reexport, disallow_subclassing_any, disallow_untyped_decorators,
# warn_redundant_casts, extra_checks.
#
# Relaxing these GLOBALLY instead would be wrong: it would also stop flagging
# app/main.py's HTTP middleware, which runs on every request.
#
# `tests.*` only matches because tests/__init__.py exists — without it mypy
# names the modules `test_x` and this section silently matches nothing, which
# warn_unused_configs does NOT catch (the section is syntactically valid).
[mypy-tests.*]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

[mypy-pgvector.*]
ignore_missing_imports = true

# jsonref ships no type stubs / py.typed marker. Required at runtime by
# instructor's Gemini structured-output path (see requirements.txt).
[mypy-jsonref]
ignore_missing_imports = true
