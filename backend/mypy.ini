[mypy]
python_version = 3.14
strict = true
warn_unused_configs = true
# Migrations are write-once and never imported by app code. The migration
# failures this repo has actually had are semantic (duplicate revision ids, two
# heads) and mypy cannot see any of them, so strict here would be a permanent
# tax on every migration PR for a class of bug that has never occurred.
exclude = alembic/

[mypy-pgvector.*]
ignore_missing_imports = true

# jsonref ships no type stubs / py.typed marker. Required at runtime by
# instructor's Gemini structured-output path (see requirements.txt).
[mypy-jsonref]
ignore_missing_imports = true
