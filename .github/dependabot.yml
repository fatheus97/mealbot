version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Held at instructor's pin (backend/requirements.txt). Lift when
      # instructor's `anthropic` extra moves past 0.93.
      - dependency-name: anthropic
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # 0.0.45 makes datetime fields timezone-aware: Postgres needs a
      # timestamp -> timestamptz migration first (ROADMAP "Held dependency
      # upgrades"). Lift in the PR that does that migration.
      - dependency-name: sqlmodel
        versions: [">=0.0.45"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.71 accepts only typescript <6.1, so npm ci fails
      # on 7.x. Lift when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
