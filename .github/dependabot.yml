version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Held at instructor's pin (backend/requirements.txt). Lift when
      # instructor's `anthropic` extra moves past 0.93.
      - dependency-name: anthropic
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # 0.0.45 makes datetime fields timezone-aware: Postgres needs a
      # timestamp -> timestamptz migration first (ROADMAP "Held dependency
      # upgrades"). Lift in the PR that does that migration.
      - dependency-name: sqlmodel
        versions: [">=0.0.45"]
      # openai 3.x needs jiter>=0.16, instructor 1.17 caps jiter<0.15, so pip
      # cannot resolve (closed #620). Lift when instructor allows jiter 0.16.
      - dependency-name: openai
        versions: [">=3"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.71 accepts only typescript <6.1, so npm ci fails
      # on 7.x. Lift when typescript-eslint supports TypeScript 7. 6.x still
      # gets proposed.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # onnxruntime (via fastembed) has no cp315 wheel yet, so the image build
      # fails (closed #619). Lift when onnxruntime ships one; the CI
      # python-version in ci.yml moves in the same PR.
      - dependency-name: python
        versions: [">=3.15"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
