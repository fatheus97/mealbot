name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write CI .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=mealbot
          POSTGRES_PASSWORD=mealbotpw
          POSTGRES_DB=mealbot
          SECRET_KEY=ci-only-not-real-64-char-key-not-for-production-0123456789abcdef
          DEMO_MODE=false
          LLM_MOCK=true
          HF_TOKEN=
          EOF

      - name: Build backend image with dev deps
        run: docker compose -f docker-compose.yml build --build-arg INSTALL_DEV=true backend

      - name: Start databases
        run: docker compose -f docker-compose.yml up -d db test-db

      - name: Wait for test-db
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.yml exec -T test-db pg_isready -U testuser -d mealbot_test; then
              exit 0
            fi
            sleep 2
          done
          echo "test-db never became ready" >&2
          exit 1

      - name: Run pytest
        # -n auto fans the suite across the runner's CPUs (public-repo
        # ubuntu-latest = 4 vCPU). Each xdist worker gets its own database — see
        # conftest._worker_database_url — so parallel workers don't collide.
        run: docker compose -f docker-compose.yml run --rm backend pytest -n auto

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=200

  backend-types:
    name: backend mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run mypy
        # mypy does static analysis, so it doesn't need a live DB, but
        # importing app/core/config.py at module load evaluates `settings =
        # Settings()` which requires SECRET_KEY and DATABASE_URL. Provide
        # throwaway values so the import succeeds.
        env:
          SECRET_KEY: ci-only-not-real-64-char-key-not-for-production-0123456789abcdef
          DATABASE_URL: postgresql+psycopg://x:y@localhost/z
        run: mypy .

  backend-lint:
    name: backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

  frontend-lint:
    name: frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint

  # Regression guard for the nginx security-header footgun documented in
  # frontend/nginx.conf: server-scope `add_header ... always` (the CSP et al.)
  # is NOT inherited into a location block that declares its own add_header.
  # This was previously only verified once by hand (build the prod image,
  # curl / and /app). Builds the real production image (nginx multi-stage,
  # not the dev override) and asserts every security header survives on
  # every known route.
  frontend-security-headers:
    name: frontend security headers
    runs-on: ubuntu-latest
    # Belt-and-suspenders alongside the per-curl --max-time below: if nginx
    # somehow hangs in a way curl's own timeout doesn't catch, fail fast
    # instead of riding out the 6h default.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Build production frontend image
        run: docker build -t mealbot-frontend-headers-test -f frontend/Dockerfile frontend

      - name: Start container
        # nginx.conf proxies /api/ to http://backend:8000 by bare hostname
        # (not a variable), so nginx fails DNS resolution and refuses to
        # start unless "backend" resolves to *something* — even though this
        # check never hits /api/. --add-host is the cheapest fix: it doesn't
        # need to be listening, just resolvable.
        run: |
          docker run -d --name frontend-headers-test \
            --add-host=backend:127.0.0.1 \
            -p 8080:80 \
            mealbot-frontend-headers-test

      - name: Wait for nginx to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf --connect-timeout 2 --max-time 5 http://localhost:8080/ -o /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "frontend container never became ready" >&2
          docker logs frontend-headers-test
          exit 1

      - name: Assert security headers present on every known route
        run: |
          set -u
          required_headers=(
            "Content-Security-Policy"
            "X-Content-Type-Options"
            "X-Frame-Options"
            "Referrer-Policy"
            "Permissions-Policy"
            "Cross-Origin-Opener-Policy"
          )
          # Known routes (docs/landing-page-plan.md): `/` — the static
          # marketing landing since Slice 3 (was the SPA shell pre-Slice-3;
          # same route, no new one to add) — and the SPA's own namespace at
          # `/app`. Check BOTH the exact `/app` and the `/app/` prefix on
          # purpose: nginx's `try_files ... /app.html` fallback internally
          # re-matches into `location /`, which masks a broken
          # `location = /app` block if only the prefix form were tested —
          # confirmed by hand while building this job.
          routes=("/" "/app" "/app/")
          failed=0
          for route in "${routes[@]}"; do
            echo "--- ${route} ---"
            headers="$(curl -sD - --connect-timeout 2 --max-time 5 -o /dev/null "http://localhost:8080${route}")"
            echo "$headers"
            for h in "${required_headers[@]}"; do
              if ! grep -qi "^${h}:" <<<"$headers"; then
                echo "::error::Missing ${h} header on ${route}"
                failed=1
              fi
            done
          done
          exit "$failed"

      - name: Access log must not record emailed secrets
        # Every single-use secret this app mails (reset / verify / invite) travels
        # as a query param, and nginx's STOCK log format logs "$request" — the
        # whole request line, query string included — right next to the client IP.
        # frontend/nginx.conf therefore defines `mealbot_noqs`, which logs $uri
        # instead. This proves it end to end rather than trusting the config.
        run: |
          set -u
          canary="ci-canary-$(date +%s)-do-not-log"
          for p in "reset_token" "verify_token" "invite"; do
            curl -s -o /dev/null --connect-timeout 2 --max-time 5 \
              "http://localhost:8080/?${p}=${canary}"
          done
          # Give nginx a moment to flush its buffered access log.
          sleep 2
          if docker logs frontend-headers-test 2>&1 | grep -q "$canary"; then
            echo "::error::nginx logged an emailed secret from the query string"
            docker logs frontend-headers-test 2>&1 | grep "$canary" | head -3
            exit 1
          fi
          echo "access log kept the secrets out"

      - name: Dump nginx logs on failure
        if: failure()
        run: docker logs frontend-headers-test

      - name: Clean up container
        if: always()
        run: docker rm -f frontend-headers-test

  # The Claude PR Review guard decides whether a review actually happened; it has
  # silently mis-decided twice (#184 shipped it, PR #229 exposed the hole). Its
  # logic is therefore unit-tested like any other production code path.
  review-guard:
    name: review guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/tests/test-ensure-review-posted.sh

  # Every mealbot job is Type=oneshot, so a failure lands in the journal and
  # nowhere else unless the unit declares OnFailure=. All three original timers
  # shipped without one — a dead billing-alerts unit was indistinguishable from
  # "no VAT threshold reached". This guard makes that regression impossible to
  # add back silently: a new .service without an alert hook fails CI.
  deploy-units:
    name: deploy units
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Every scheduled unit alerts on failure
        run: |
          set -uo pipefail
          failed=0
          for svc in deploy/systemd/mealbot-*.service; do
            # The alert template is the handler itself: it is triggered only by
            # another unit's OnFailure=, and giving it one would loop.
            if [ "$(basename "$svc")" = "mealbot-alert@.service" ]; then
              if grep -q '^OnFailure=' "$svc"; then
                echo "::error::${svc} must NOT declare OnFailure= (it would alert on itself)"
                failed=1
              fi
              continue
            fi
            if ! grep -q '^OnFailure=mealbot-alert@%n\.service$' "$svc"; then
              echo "::error::${svc} is missing 'OnFailure=mealbot-alert@%n.service'"
              failed=1
            fi
          done
          exit "$failed"

      - name: Scheduled units never run at boot
        # A [Install] section on the .service would let `systemctl enable` on the
        # wrong unit run the job at every boot instead of on its schedule.
        run: |
          set -uo pipefail
          failed=0
          for svc in deploy/systemd/mealbot-*.service; do
            if grep -q '^\[Install\]' "$svc"; then
              echo "::error::${svc} must not have an [Install] section — enable the .timer"
              failed=1
            fi
          done
          exit "$failed"

      - name: Every timer has a service and vice versa
        run: |
          set -uo pipefail
          failed=0
          for timer in deploy/systemd/mealbot-*.timer; do
            svc="${timer%.timer}.service"
            if [ ! -f "$svc" ]; then
              echo "::error::${timer} has no matching ${svc}"
              failed=1
            fi
          done
          exit "$failed"

      - name: Backup scripts parse and pass shellcheck
        run: |
          set -uo pipefail
          failed=0
          for s in scripts/*.sh; do
            bash -n "$s" || { echo "::error::${s} is not valid bash"; failed=1; }
          done
          shellcheck scripts/db-backup.sh scripts/db-restore.sh || failed=1
          exit "$failed"

      - name: Backup scripts are executable
        # systemd ExecStart= runs the file directly; a non-executable script
        # fails at runtime on the box, long after CI was green.
        run: |
          set -uo pipefail
          failed=0
          for s in scripts/db-backup.sh scripts/db-restore.sh; do
            if [ ! -x "$s" ]; then
              echo "::error::${s} is not executable (git update-index --chmod=+x ${s})"
              failed=1
            fi
          done
          exit "$failed"

      - name: The backup job never prunes Docker volumes
        # A volume prune anywhere in the deploy tooling would delete the Postgres
        # data this whole PR exists to protect.
        #
        # Restricted to executable lines in executable files. A bare
        # `grep -rn -- '--volumes' deploy/ scripts/` matches the COMMENTS warning
        # against volume prunes (mealbot-docker-cleanup.service, README §3) and so
        # fails on a clean tree — this step was red on the commit that introduced
        # it. `^[^#]*` skips comment lines; --include skips prose files.
        run: |
          if grep -rn --include='*.sh' --include='*.service' -E '^[^#]*--volumes' deploy/ scripts/; then
            echo "::error::volume-touching prune found in deploy tooling"
            exit 1
          fi
