name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write CI .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=mealbot
          POSTGRES_PASSWORD=mealbotpw
          POSTGRES_DB=mealbot
          SECRET_KEY=ci-only-not-real-64-char-key-not-for-production-0123456789abcdef
          DEMO_MODE=false
          LLM_MOCK=true
          HF_TOKEN=
          EOF

      - name: Build backend image with dev deps
        run: docker compose -f docker-compose.yml build --build-arg INSTALL_DEV=true backend

      - name: Start databases
        run: docker compose -f docker-compose.yml up -d db test-db

      - name: Wait for test-db
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.yml exec -T test-db pg_isready -U testuser -d mealbot_test; then
              exit 0
            fi
            sleep 2
          done
          echo "test-db never became ready" >&2
          exit 1

      - name: Run pytest
        # -n auto fans the suite across the runner's CPUs (public-repo
        # ubuntu-latest = 4 vCPU). Each xdist worker gets its own database — see
        # conftest._worker_database_url — so parallel workers don't collide.
        run: docker compose -f docker-compose.yml run --rm backend pytest -n auto

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=200

  backend-types:
    name: backend mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run mypy
        # mypy does static analysis, so it doesn't need a live DB, but
        # importing app/core/config.py at module load evaluates `settings =
        # Settings()` which requires SECRET_KEY and DATABASE_URL. Provide
        # throwaway values so the import succeeds.
        env:
          SECRET_KEY: ci-only-not-real-64-char-key-not-for-production-0123456789abcdef
          DATABASE_URL: postgresql+psycopg://x:y@localhost/z
        run: mypy .

  backend-lint:
    name: backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

  frontend-lint:
    name: frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint

  # Regression guard for the nginx security-header footgun documented in
  # frontend/nginx.conf: server-scope `add_header ... always` (the CSP et al.)
  # is NOT inherited into a location block that declares its own add_header.
  # This was previously only verified once by hand (build the prod image,
  # curl / and /app). Builds the real production image (nginx multi-stage,
  # not the dev override) and asserts every security header survives on
  # every known route.
  frontend-security-headers:
    name: frontend security headers
    runs-on: ubuntu-latest
    # Belt-and-suspenders alongside the per-curl --max-time below: if nginx
    # somehow hangs in a way curl's own timeout doesn't catch, fail fast
    # instead of riding out the 6h default.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Build production frontend image
        run: docker build -t mealbot-frontend-headers-test -f frontend/Dockerfile frontend

      - name: Start container
        # nginx.conf proxies /api/ to http://backend:8000 by bare hostname
        # (not a variable), so nginx fails DNS resolution and refuses to
        # start unless "backend" resolves to *something* — even though this
        # check never hits /api/. --add-host is the cheapest fix: it doesn't
        # need to be listening, just resolvable.
        run: |
          docker run -d --name frontend-headers-test \
            --add-host=backend:127.0.0.1 \
            -p 8080:80 \
            mealbot-frontend-headers-test

      - name: Wait for nginx to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf --connect-timeout 2 --max-time 5 http://localhost:8080/ -o /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "frontend container never became ready" >&2
          docker logs frontend-headers-test
          exit 1

      - name: Assert security headers present on every known route
        run: |
          set -u
          required_headers=(
            "Content-Security-Policy"
            "X-Content-Type-Options"
            "X-Frame-Options"
            "Referrer-Policy"
            "Permissions-Policy"
            "Cross-Origin-Opener-Policy"
          )
          # Known routes (docs/landing-page-plan.md): `/` — the static
          # marketing landing since Slice 3 (was the SPA shell pre-Slice-3;
          # same route, no new one to add) — and the SPA's own namespace at
          # `/app`. Check BOTH the exact `/app` and the `/app/` prefix on
          # purpose: nginx's `try_files ... /app.html` fallback internally
          # re-matches into `location /`, which masks a broken
          # `location = /app` block if only the prefix form were tested —
          # confirmed by hand while building this job.
          routes=("/" "/app" "/app/" "/privacy" "/terms")
          failed=0
          for route in "${routes[@]}"; do
            echo "--- ${route} ---"
            headers="$(curl -sD - --connect-timeout 2 --max-time 5 -o /dev/null "http://localhost:8080${route}")"
            echo "$headers"
            for h in "${required_headers[@]}"; do
              if ! grep -qi "^${h}:" <<<"$headers"; then
                echo "::error::Missing ${h} header on ${route}"
                failed=1
              fi
            done
          done
          exit "$failed"

      - name: Access log must not record emailed secrets
        # Every single-use secret this app mails (reset / verify / invite) travels
        # as a query param, and nginx's STOCK log format logs "$request" — the
        # whole request line, query string included — right next to the client IP.
        # frontend/nginx.conf therefore defines `mealbot_noqs`, which logs $uri
        # instead. This proves it end to end rather than trusting the config.
        run: |
          set -u
          canary="ci-canary-$(date +%s)-do-not-log"
          for p in "reset_token" "verify_token" "invite"; do
            curl -s -o /dev/null --connect-timeout 2 --max-time 5 \
              "http://localhost:8080/?${p}=${canary}"
          done
          # Give nginx a moment to flush its buffered access log.
          sleep 2
          if docker logs frontend-headers-test 2>&1 | grep -q "$canary"; then
            echo "::error::nginx logged an emailed secret from the query string"
            docker logs frontend-headers-test 2>&1 | grep "$canary" | head -3
            exit 1
          fi
          echo "access log kept the secrets out"

      - name: Dump nginx logs on failure
        if: failure()
        run: docker logs frontend-headers-test

      - name: Clean up container
        if: always()
        run: docker rm -f frontend-headers-test

  # Consent is recorded against app.core.legal.TERMS_VERSION. If a legal page is
  # edited and that constant is not, every consent stored afterwards is filed
  # against text the user never saw — and nothing at runtime would notice, since
  # the column is still populated and the flow still works. The check lives here
  # rather than in pytest because it spans backend/ and frontend/, and the
  # backend container mounts only ./backend: the same assertion as a pytest would
  # silently SKIP in CI.
  legal-version:
    name: legal version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: TERMS_VERSION matches all four published pages
        # POSIX -E rather than -P throughout: -P is a GNU extension that also
        # refuses to run under some locales, so the same commands would not be
        # checkable on the dev machine.
        #
        # Reads <time datetime="YYYY-MM-DD">, not the printed prose date. The
        # prose is now in two languages — "6 August 2026" and "6. srpna 2026" —
        # and `date -d` cannot parse the Czech one under any locale CI is
        # guaranteed to have. The machine-readable attribute is the same string
        # in every language, which is what <time> is for.
        #
        # That also retires the `date -d ""` trap the previous version had to
        # guard against by hand: there is no date PARSING left, only a string
        # comparison against the constant.
        run: |
          set -uo pipefail
          constant="$(sed -n 's/.*TERMS_VERSION *= *"\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)".*/\1/p' \
            backend/app/core/legal.py | head -1)"
          if [ -z "$constant" ]; then
            echo "::error::could not read TERMS_VERSION from backend/app/core/legal.py"
            exit 1
          fi
          pages="frontend/terms.html frontend/privacy.html frontend/cs/terms.html frontend/cs/privacy.html"
          # Pinned COUNT, load-bearing: a renamed or deleted page would
          # otherwise drop silently out of the loop and the job would pass
          # having checked fewer documents than exist. Both editions of both
          # documents are equally authoritative, so all four must agree.
          expected=4
          found=0
          failed=0
          for page in $pages; do
            if [ ! -f "$page" ]; then
              echo "::error::${page} does not exist — the legal set is meant to be ${expected} pages"
              failed=1
              continue
            fi
            found=$((found + 1))
            iso="$(grep -oE '<time datetime="[0-9]{4}-[0-9]{2}-[0-9]{2}"' "$page" \
              | head -1 | sed 's/.*datetime="//; s/"//')"
            if [ -z "$iso" ]; then
              echo "::error::${page} has no <time datetime=\"YYYY-MM-DD\"> element"
              failed=1
              continue
            fi
            if [ "$iso" != "$constant" ]; then
              echo "::error::${page} says ${iso} but TERMS_VERSION is ${constant}"
              failed=1
            fi
          done
          if [ "$found" -ne "$expected" ]; then
            echo "::error::checked ${found} legal pages, expected ${expected}"
            failed=1
          fi
          exit "$failed"

  # The set of translated locales is declared twice — once for the UI
  # (frontend/src/store/useLocaleStore.ts) and once for email
  # (backend/app/core/i18n.py) — because neither side can import the other.
  # Drift is silent and lands squarely on the user: a Czech UI whose
  # confirmation email arrives in English, or the reverse. Neither test suite
  # can catch it, because the backend container mounts only ./backend and the
  # frontend one only ./frontend — the same boundary that made the
  # TERMS_VERSION check a CI job rather than a pytest.
  locale-parity:
    name: locale parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: The UI and email locale lists agree
        run: |
          set -uo pipefail
          # One locale per line, sorted, from each declaration.
          fe="$(sed -n "s/.*UI_LOCALES *= *\[\(.*\)\] as const.*/\1/p" \
            frontend/src/store/useLocaleStore.ts \
            | tr -d "' \"" | tr ',' '\n' | grep -v '^$' | sort)"
          be="$(sed -n 's/.*UI_LOCALES: *Final\[tuple\[Locale, *\.\.\.\]\] *= *(\(.*\)).*/\1/p' \
            backend/app/core/i18n.py \
            | tr -d "' \"" | tr ',' '\n' | grep -v '^$' | sort)"
          # Load-bearing: an empty capture would compare "" to "" and PASS,
          # so a renamed constant would silently disable this check — the
          # same trap `date -d ""` sets in the legal-version job above.
          if [ -z "$fe" ]; then
            echo "::error::could not read UI_LOCALES from frontend/src/store/useLocaleStore.ts"
            exit 1
          fi
          if [ -z "$be" ]; then
            echo "::error::could not read UI_LOCALES from backend/app/core/i18n.py"
            exit 1
          fi
          if [ "$fe" != "$be" ]; then
            echo "::error::locale lists differ — UI: $(echo "$fe" | tr '\n' ' ')| email: $(echo "$be" | tr '\n' ' ')"
            exit 1
          fi
          echo "both declare: $(echo "$fe" | tr '\n' ' ')"

  # The Claude PR Review guard decides whether a review actually happened; it has
  # silently mis-decided twice (#184 shipped it, PR #229 exposed the hole). Its
  # logic is therefore unit-tested like any other production code path.
  review-guard:
    name: review guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/tests/test-ensure-review-posted.sh

  # Every mealbot job is Type=oneshot, so a failure lands in the journal and
  # nowhere else unless the unit declares OnFailure=. All three original timers
  # shipped without one — a dead billing-alerts unit was indistinguishable from
  # "no VAT threshold reached". This guard makes that regression impossible to
  # add back silently: a new .service without an alert hook fails CI.
  deploy-units:
    name: deploy units
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Every scheduled unit alerts on failure
        run: |
          set -uo pipefail
          failed=0
          for svc in deploy/systemd/mealbot-*.service; do
            # The alert template is the handler itself: it is triggered only by
            # another unit's OnFailure=, and giving it one would loop.
            if [ "$(basename "$svc")" = "mealbot-alert@.service" ]; then
              if grep -q '^OnFailure=' "$svc"; then
                echo "::error::${svc} must NOT declare OnFailure= (it would alert on itself)"
                failed=1
              fi
              continue
            fi
            if ! grep -q '^OnFailure=mealbot-alert@%n\.service$' "$svc"; then
              echo "::error::${svc} is missing 'OnFailure=mealbot-alert@%n.service'"
              failed=1
            fi
          done
          exit "$failed"

      - name: Scheduled units never run at boot
        # A [Install] section on the .service would let `systemctl enable` on the
        # wrong unit run the job at every boot instead of on its schedule.
        run: |
          set -uo pipefail
          failed=0
          for svc in deploy/systemd/mealbot-*.service; do
            if grep -q '^\[Install\]' "$svc"; then
              echo "::error::${svc} must not have an [Install] section — enable the .timer"
              failed=1
            fi
          done
          exit "$failed"

      - name: Every timer has a service and vice versa
        run: |
          set -uo pipefail
          failed=0
          for timer in deploy/systemd/mealbot-*.timer; do
            svc="${timer%.timer}.service"
            if [ ! -f "$svc" ]; then
              echo "::error::${timer} has no matching ${svc}"
              failed=1
            fi
          done
          exit "$failed"

      - name: Backup scripts parse and pass shellcheck
        run: |
          set -uo pipefail
          failed=0
          for s in scripts/*.sh; do
            bash -n "$s" || { echo "::error::${s} is not valid bash"; failed=1; }
          done
          shellcheck scripts/*.sh || failed=1
          exit "$failed"

      - name: Backup scripts are executable
        # systemd ExecStart= runs the file directly; a non-executable script
        # fails at runtime on the box, long after CI was green.
        run: |
          set -uo pipefail
          failed=0
          for s in scripts/*.sh; do
            if [ ! -x "$s" ]; then
              echo "::error::${s} is not executable (git update-index --chmod=+x ${s})"
              failed=1
            fi
          done
          exit "$failed"

      - name: The unit sync installs, reloads, restarts and enables correctly
        # Guards the behaviours that make this safe to run every ten minutes as
        # root, none of which shellcheck can see and none of which can be tested
        # on the box without waiting for real drift:
        #   - an unchanged tree must not call systemctl at all;
        #   - an edited RUNNING timer must be restarted, or daemon-reload leaves
        #     the old schedule live and the sync silently lies;
        #   - an edited STOPPED timer must NOT be restarted, or a deliberate
        #     `systemctl disable --now` comes back ten minutes later;
        #   - a .service is never restarted (they are oneshot — that would run
        #     the backup/prune as a side effect of editing a comment).
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          src="$work/src"; dst="$work/dst"; bin="$work/bin"
          mkdir -p "$src" "$dst" "$bin"
          # Stub systemctl: record every call, and answer `is-active` from a file
          # the test controls so both timer states can be exercised.
          cat > "$bin/systemctl" <<'STUB'
          #!/usr/bin/env bash
          echo "$*" >> "$CALLS"
          if [ "$1" = "is-active" ]; then
            grep -qx "${@: -1}" "$ACTIVE" 2>/dev/null || exit 1
          fi
          exit 0
          STUB
          sed -i 's/^          //' "$bin/systemctl"
          chmod +x "$bin/systemctl"
          : > "$work/active"
          printf 'v1\n' > "$src/mealbot-demo.service"
          printf 'v1\n' > "$src/mealbot-demo.timer"
          run() { CALLS="$work/calls" ACTIVE="$work/active" \
                  MEALBOT_UNIT_SRC="$src" MEALBOT_UNIT_DST="$dst" \
                  MEALBOT_SYSTEMCTL="$bin/systemctl" ./scripts/sync-systemd-units.sh; }

          # (1) First run: both files land, one reload, the new timer is enabled.
          run > "$work/out1"
          cmp -s "$src/mealbot-demo.service" "$dst/mealbot-demo.service" \
            || { echo "::error::unit was not installed"; exit 1; }
          grep -qx 'daemon-reload' "$work/calls" \
            || { echo "::error::no daemon-reload after installing units"; exit 1; }
          grep -qx 'enable --now mealbot-demo.timer' "$work/calls" \
            || { echo "::error::a newly installed timer was not enabled"; exit 1; }

          # (2) Nothing changed: no systemctl calls at all.
          before=$(wc -l < "$work/calls")
          run > "$work/out2"
          [ "$(wc -l < "$work/calls")" = "$before" ] \
            || { echo "::error::no-op run still called systemctl"; exit 1; }

          # (3) Edited timer that is RUNNING: reinstalled, reloaded, restarted so
          #     a changed schedule actually takes effect — but never re-enabled.
          echo 'mealbot-demo.timer' > "$work/active"
          printf 'v2\n' > "$src/mealbot-demo.timer"
          run > "$work/out3"
          cmp -s "$src/mealbot-demo.timer" "$dst/mealbot-demo.timer" \
            || { echo "::error::edited unit was not reinstalled"; exit 1; }
          [ "$(grep -cx 'daemon-reload' "$work/calls")" = 2 ] \
            || { echo "::error::edited unit did not trigger daemon-reload"; exit 1; }
          grep -qx 'restart mealbot-demo.timer' "$work/calls" \
            || { echo "::error::an edited RUNNING timer was not restarted (its old schedule stays live)"; exit 1; }
          [ "$(grep -cx 'enable --now mealbot-demo.timer' "$work/calls")" = 1 ] \
            || { echo "::error::an EDITED unit re-enabled its timer"; exit 1; }

          # (4) Edited timer the operator STOPPED: must stay stopped.
          : > "$work/active"
          printf 'v3\n' > "$src/mealbot-demo.timer"
          run > "$work/out4"
          [ "$(grep -cx 'restart mealbot-demo.timer' "$work/calls")" = 1 ] \
            || { echo "::error::a STOPPED timer was restarted by the sync"; exit 1; }

          # (5) An edited .service is never restarted — that would run the job.
          echo 'mealbot-demo.timer' > "$work/active"
          printf 'v2\n' > "$src/mealbot-demo.service"
          run > "$work/out5"
          grep -qx 'restart mealbot-demo.service' "$work/calls" \
            && { echo "::error::the sync restarted a oneshot .service"; exit 1; }

          # (6) A missing source tree must fail, never report a clean no-op.
          if MEALBOT_UNIT_SRC="$work/gone" MEALBOT_UNIT_DST="$dst" \
             MEALBOT_SYSTEMCTL="$bin/systemctl" ./scripts/sync-systemd-units.sh; then
            echo "::error::missing source directory exited 0"
            exit 1
          fi
          rm -rf "$work"

      - name: A broken disk reading fails loudly
        # The bug this guards: `used_pct="$(df ...)"` is an ASSIGNMENT, and
        # `set -e` does not abort on a failing command substitution used as one.
        # A broken `df` therefore left used_pct empty, sailed through the
        # comparisons (a `[ "" -lt 85 ]` error reads as false) and mailed
        # "[mealbot] disk % full" while exiting 0 — so OnFailure= never fired.
        # Both paths below are container-free, so this stays a seconds-long step.
        run: |
          set -uo pipefail
          failed=0
          if DISK_ALERT_MOUNT=/no/such/mount ./scripts/disk-alert.sh 2>/dev/null; then
            echo "::error::disk-alert.sh exited 0 despite being unable to read the disk"
            failed=1
          fi
          state="$(mktemp)"
          printf '2000-01-01 90\n' > "$state"
          if ! DISK_ALERT_FAKE_PCT=10 DISK_ALERT_STATE="$state" ./scripts/disk-alert.sh; then
            echo "::error::disk-alert.sh failed on an ordinary below-threshold run"
            failed=1
          fi
          if [ -f "$state" ]; then
            echo "::error::below-threshold run must clear the state file, or a later crossing stays silent"
            failed=1
          fi
          exit "$failed"

      - name: The off-site backup is inert when parked and loud when broken
        # It ships disabled and is meant to be installed BEFORE a destination
        # exists, so "does nothing, exits 0" is a behaviour with real weight —
        # if it ever started failing while parked, the alert mail would train
        # the operator to ignore this unit before it does anything useful.
        #
        # The opposite failure matters more: once enabled, every problem must
        # exit non-zero. A backup job that quietly does nothing is discovered at
        # the moment you need it.
        #
        # Each case asserts the REASON, not just a non-zero exit. An earlier
        # draft checked only the exit code, and three of these passed on an
        # unrelated prerequisite error — they would have passed with the guards
        # under test deleted. Container-free throughout.
        run: |
          set -uo pipefail
          failed=0
          empty="$(mktemp -d)"

          want_fail() {
            expect="$1"; desc="$2"; shift 2
            if out="$(env "$@" ./scripts/offsite-backup.sh 2>&1)"; then
              echo "::error::${desc}: expected a non-zero exit, got 0"
              failed=1
            elif ! printf '%s' "$out" | grep -q "$expect"; then
              echo "::error::${desc}: exited non-zero but for the wrong reason"
              echo "::error::  wanted to see: ${expect}"
              printf '%s\n' "$out" | sed 's/^/          /'
              failed=1
            fi
          }

          if ! ./scripts/offsite-backup.sh | grep -q "not enabled"; then
            echo "::error::parked run must exit 0 and say so"
            failed=1
          fi

          want_fail "enabled but unconfigured" "enabled with no destination" \
            OFFSITE_BACKUP_ENABLED=true

          want_fail "no completed dump" "nothing to upload" \
            OFFSITE_BACKUP_ENABLED=true OFFSITE_RCLONE_REMOTE=b2:bucket/x \
            OFFSITE_GPG_RECIPIENT=nobody@example.com BACKUP_DIR="$empty"

          # A .partial is a FAILED dump. Shipping one would put a file at the
          # destination that looks like a backup and is not.
          touch "$empty/mealbot-2026-01-01T000000Z.dump.partial"
          want_fail "no completed dump" "a .partial is not a dump" \
            OFFSITE_BACKUP_ENABLED=true OFFSITE_RCLONE_REMOTE=b2:bucket/x \
            OFFSITE_GPG_RECIPIENT=nobody@example.com BACKUP_DIR="$empty"

          # A stale dump means db-backup is broken. Re-uploading yesterday's and
          # reporting success would mask that indefinitely.
          touch -d '3 days ago' "$empty/mealbot-2026-01-01T000000Z.dump"
          want_fail "more than 1 day old" "a stale dump means db-backup is broken" \
            OFFSITE_BACKUP_ENABLED=true OFFSITE_RCLONE_REMOTE=b2:bucket/x \
            OFFSITE_GPG_RECIPIENT=nobody@example.com BACKUP_DIR="$empty"

          # A FRESH dump must get PAST every guard above and reach the tooling
          # check. Without this the suite only ever proves the script can
          # refuse — a guard accidentally rejecting good input would look
          # identical to a guard working.
          touch "$empty/mealbot-2026-01-02T000000Z.dump"
          want_fail "is not installed" "a fresh dump reaches the tooling check" \
            OFFSITE_BACKUP_ENABLED=true OFFSITE_RCLONE_REMOTE=b2:bucket/x \
            OFFSITE_GPG_RECIPIENT=nobody@example.com BACKUP_DIR="$empty" \
            PATH=/usr/bin:/bin

          exit "$failed"

      - name: The backup job never prunes Docker volumes
        # A volume prune anywhere in the deploy tooling would delete the Postgres
        # data this whole PR exists to protect.
        #
        # Restricted to executable lines in executable files. A bare
        # `grep -rn -- '--volumes' deploy/ scripts/` matches the COMMENTS warning
        # against volume prunes (mealbot-docker-cleanup.service, README §3) and so
        # fails on a clean tree — this step was red on the commit that introduced
        # it. `^[^#]*` skips comment lines; --include skips prose files.
        run: |
          if grep -rn --include='*.sh' --include='*.service' -E '^[^#]*--volumes' deploy/ scripts/; then
            echo "::error::volume-touching prune found in deploy tooling"
            exit 1
          fi
