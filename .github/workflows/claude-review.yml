name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Pinned by SHA to v1.0.166 (commit f87768c = annotated tag v1.0.166,
      # bundles Claude Code 2.1.202). This pin reviewed PRs #173–#180 cleanly.
      # The review turn began silently erroring on 2026-07-10 with NO change
      # here — the model turn returns is_error:true after an empty ~2s turn
      # (most likely an expired / usage-limited CLAUDE_CODE_OAUTH_TOKEN), which
      # the action redacts as "full output hidden for security". That is a
      # runtime failure, NOT the pin. Before bumping, test on a throwaway PR and
      # confirm a REAL review body is posted, not just the track_progress stub.
      - uses: anthropics/claude-code-action@f87768c6d25f92ae6efa7175e223ef77d4cbf97f  # v1.0.166
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # Temporary diagnostic: unhides the SDK error the action otherwise
          # redacts ("full output hidden for security"), so an errored empty
          # turn shows its actual cause in the job log. Safe on a private,
          # single-owner repo. Remove once the review turn is healthy again.
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            CI on this repo already enforces: pytest, mypy (strict), ruff, eslint,
            frontend build, gitleaks. Do NOT re-check those — focus your review on
            what CI cannot catch.

            Review priorities, in order:
            1. Correctness and edge cases — does the change do what its description claims? What breaks on the unhappy path?
            2. Security — per CLAUDE.md, treat all user input as malicious; external API/LLM/DB calls need timeouts + specific exceptions.
            3. Conventions from CLAUDE.md and .claude/rules/ — FastAPI Pydantic models, async discipline, structured LLM output, Dockerfile practices, conventional commits.
            4. Design smells — premature abstraction, dead code, hidden behavior, broken invariants.
            5. Migration & deploy risk — flag Alembic migrations that need a deployment note, flag changes that require host .env updates.

            Skip trivia (whitespace, obvious typos). Be direct and specific — quote file:line. Staff-engineer tone: if something is a production risk, say so.

            REVIEW-ONLY MODE — hard rules:
            - You are a reviewer, not an implementer. Do NOT attempt to write,
              edit, stage, commit, push, or rebase code. You have no write
              access to the repo and any such attempt will fail and pollute
              the review.
            - Do NOT claim to have made commits, fixes, or pushes. Do NOT
              reference commit SHAs you have not been shown — never invent
              them. If a fix is needed, describe the change in prose with the
              exact file:line and the snippet to apply, and let the human
              author commit it.
            - Do NOT include "Fix this →" links, claude.ai/code links, or any
              other call-to-action that triggers a follow-up agent. Your
              output is feedback in PR comments, nothing else.

            Post top-level feedback with `gh pr comment`. Use inline comments for specific code issues.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # A silent no-op review (errored / empty model turn) posts only the
      # ~164-char track_progress stub yet the job still concludes SUCCESS — that
      # is exactly how #181–#183 merged UNREVIEWED with a green `review` check.
      # This guard makes that state a RED check: it requires either inline review
      # comments or a claude[bot] comment substantially longer than the stub.
      # `review` is not a required status check, so this signals loudly without
      # blocking auto-merge — but a red `review` must be treated as "not reviewed"
      # by the merge decision (human or orchestrator), never merged past.
      - name: Ensure a real review was posted
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          inline=$(gh api "repos/$REPO/pulls/$PR/comments" --jq 'length')
          maxbody=$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq '[.[] | select(.user.login | test("claude"; "i")) | (.body | length)] | max // 0')
          echo "inline review comments: $inline"
          echo "longest claude[bot] comment: $maxbody chars"
          if [ "$inline" -gt 0 ] || [ "$maxbody" -gt 300 ]; then
            echo "✅ Real review detected."
          else
            echo "::error::Claude PR Review produced no real review — only the progress stub (${maxbody} chars, ${inline} inline). The review turn errored (likely an empty model turn); check the job log (show_full_output: true) and rotate the CLAUDE_CODE_OAUTH_TOKEN secret."
            exit 1
          fi
