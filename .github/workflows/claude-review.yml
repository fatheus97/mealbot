name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Pinned by SHA to v1.0.166 (commit f87768c = annotated tag v1.0.166,
      # bundles Claude Code 2.1.202). Reviewed PRs #173–#180 cleanly, then
      # silently stubbed #181–#183 (2026-07-10) — root cause was a dead
      # CLAUDE_CODE_OAUTH_TOKEN (401 authentication_failed), NOT the pin;
      # fixed by rotating the secret. The guard step below now turns a silent
      # no-op review RED. Before bumping this pin, test on a NORMAL (non-workflow)
      # PR — a workflow-editing PR makes the action skip validation and not run.
      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10  # v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            CI on this repo already enforces: pytest, mypy (strict), ruff, eslint,
            frontend build, gitleaks. Do NOT re-check those — focus your review on
            what CI cannot catch.

            Review priorities, in order:
            1. Correctness and edge cases — does the change do what its description claims? What breaks on the unhappy path?
            2. Security — per CLAUDE.md, treat all user input as malicious; external API/LLM/DB calls need timeouts + specific exceptions.
            3. Conventions from CLAUDE.md and .claude/rules/ — FastAPI Pydantic models, async discipline, structured LLM output, Dockerfile practices, conventional commits.
            4. Design smells — premature abstraction, dead code, hidden behavior, broken invariants.
            5. Migration & deploy risk — flag Alembic migrations that need a deployment note, flag changes that require host .env updates.

            Skip trivia (whitespace, obvious typos). Be direct and specific — quote file:line. Staff-engineer tone: if something is a production risk, say so.

            REVIEW-ONLY MODE — hard rules:
            - You are a reviewer, not an implementer. Do NOT attempt to write,
              edit, stage, commit, push, or rebase code. You have no write
              access to the repo and any such attempt will fail and pollute
              the review.
            - Do NOT claim to have made commits, fixes, or pushes. Do NOT
              reference commit SHAs you have not been shown — never invent
              them. If a fix is needed, describe the change in prose with the
              exact file:line and the snippet to apply, and let the human
              author commit it.
            - Do NOT include "Fix this →" links, claude.ai/code links, or any
              other call-to-action that triggers a follow-up agent. Your
              output is feedback in PR comments, nothing else.

            DO NOT RE-RAISE ALREADY-DISMISSED FINDINGS (this PR may have prior review rounds):
            - Before finalizing, read the existing review threads and their replies:
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
              (inline review comments + replies) and `gh pr view ${{ github.event.pull_request.number }} --json comments`.
            - If a candidate finding was raised in a prior round and the author replied DISMISSING it
              (false positive / hallucination / wrong / by-design / deliberate out-of-scope), do NOT raise it
              again as a new or blocking inline comment. The author (Opus) is the final authority and has
              justified the dismissal. At most mention it ONCE in the top-level summary, explicitly labelled
              "previously dismissed — not re-raising", and only if the code has since changed in a way that
              genuinely reintroduces the concern.
            - Findings the author FIXED must simply not reappear. Raise only genuinely NEW issues, or ones the
              current code still exhibits that were never addressed.

            Post top-level feedback with `gh pr comment`. Use inline comments for specific code issues.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"

      # A review that errors, stalls or produces an empty model turn still leaves
      # this job concluding SUCCESS — that is how #181–#183 merged UNREVIEWED with
      # a green `review` check. This guard turns those states RED. The logic and
      # its rationale live in the script; it is unit-tested by the `review-guard`
      # CI job, because the guard itself has now been wrong twice.
      - name: Ensure a real review was posted
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            | bash .github/scripts/ensure-review-posted.sh "${{ github.run_id }}"
